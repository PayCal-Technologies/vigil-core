name: Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: vigil-nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Derive immutable nightly identity
        id: metadata
        shell: bash
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          date="$(date -u -d "@$epoch" +%Y%m%d)"
          short="${GITHUB_SHA:0:12}"
          printf 'version=0.0.0-nightly.%s.%s\nepoch=%s\n' "$date" "$short" "$epoch" >> "$GITHUB_OUTPUT"

      - name: Verify source
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          scripts/run-fuzz-smoke.sh

      - name: Build reproducible nightly archives
        env:
          RELEASE_TAG: v${{ steps.metadata.outputs.version }}
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
          ALLOW_UNTAGGED_RELEASE: '1'
          SKIP_HOMEBREW_FORMULA: '1'
        run: scripts/build-release.sh

      - name: Verify reproducibility
        env:
          RELEASE_TAG: v${{ steps.metadata.outputs.version }}
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
          ALLOW_UNTAGGED_RELEASE: '1'
          SKIP_HOMEBREW_FORMULA: '1'
        run: scripts/check-release-reproducibility.sh dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/vigil_${{ steps.metadata.outputs.version }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize checksums
        run: scripts/release-checksums.sh dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums
        run: cosign sign-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json --yes

      - name: Attest nightly artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_sbom.spdx.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json

      - name: Smoke test Linux archive
        shell: bash
        run: |
          version="${{ steps.metadata.outputs.version }}"
          archive="dist/vigil_${version}_linux_amd64.tar.gz"
          scripts/smoke-release-archive.sh "$archive" "$version" linux amd64

      - name: Upload nightly channel artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vigil-nightly-${{ steps.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Download nightly channel artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: vigil-nightly-${{ steps.metadata.outputs.version }}
          path: downloaded

      - name: Verify downloaded nightly channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd downloaded
          sha256sum -c SHA256SUMS
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/nightly.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          for artifact in ./*.tar.gz ./*_sbom.spdx.json SHA256SUMS SHA256SUMS.sigstore.json; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
