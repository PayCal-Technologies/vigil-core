name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Test
        run: go test ./...
      - name: Build artifacts
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/vigil-${os}-${arch}" ./cmd/vigil
          done
          ./dist/vigil-linux-amd64 manpage > dist/vigil.1
          ./dist/vigil-linux-amd64 completion bash > dist/vigil.bash
          ./dist/vigil-linux-amd64 completion zsh > dist/_vigil
          ./dist/vigil-linux-amd64 completion fish > dist/vigil.fish
          (cd dist && sha256sum vigil-* vigil.* _vigil > SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2
        with:
          files: |
            dist/vigil-*
            dist/vigil.*
            dist/_vigil
            dist/SHA256SUMS
