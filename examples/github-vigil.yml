name: Vigil

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vigil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.0'
      - name: Install Vigil
        run: |
          mkdir -p bin
          GOBIN="$PWD/bin" go install github.com/PayCal-Technologies/vigil-core/cmd/vigil@f48f19c3764a5a256455cc1d858d74eda2775745
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Verify Vigil
        run: vigil verify --json
      - name: Run Vigil Gates
        run: vigil workflow:local --json
