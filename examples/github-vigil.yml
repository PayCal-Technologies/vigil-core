name: Vigil

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vigil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install Vigil
        run: |
          mkdir -p bin
          GOBIN="$PWD/bin" go install github.com/PayCal-Technologies/vigil-public/cmd/vigil@${{ github.sha }}
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Verify Vigil
        run: vigil verify --json
      - name: Run Vigil Gates
        run: vigil workflow:local --json
